name: Godot CI
on:
  push:
    branches: [main, "docs/project-foundation"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import
        run: Godot_v4.4.1-stable_linux.x86_64 --headless --path game --editor --import
      - name: Task engine tests
        run: Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://tests/test_tasks.gd
      - name: Scene smoke
        run: Godot_v4.4.1-stable_linux.x86_64 --headless --path game --quit-after 10
