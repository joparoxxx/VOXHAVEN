name: Android prototype APK
on:
  workflow_dispatch:
  # Triggered only when the APK workflow itself changes.
  # Ordinary gameplay commits do not launch an APK export.
  # QA export: restored gravity plus legacy-save mesh snapshot caching and backup UI (9feff01).
  push:
    branches:
      - game/colony-foundation
    paths:
      - '.github/workflows/android-build.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: tools-cache
        with:
          path: ~/.cache/voxhaven/godot
          key: godot-linux-x64-4.5.1
      - uses: actions/cache/restore@v4
        id: import-cache
        with:
          path: .godot/imported
          key: godot-import-4.5.1-${{ runner.os }}-${{ hashFiles('assets/**', '**/*.import', 'project.godot') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages using runner SDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then sdkmanager="$(command -v sdkmanager)"; fi
          if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: actions/cache/restore@v4
        id: templates-cache
        with:
          path: ~/.local/share/godot/export_templates/4.5.1.stable
          key: godot-templates-4.5.1
      - name: Install Godot and templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$HOME/.cache/voxhaven/godot"
          binary="$HOME/.cache/voxhaven/godot/godot"
          if [ ! -x "$binary" ]; then
            curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
            unzip -q /tmp/godot.zip -d /tmp/godot
            install /tmp/godot/Godot* "$binary"
          fi
          sudo install "$binary" /usr/local/bin/godot
          if [ ! -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk" ]; then
            curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
            unzip -q /tmp/templates.tpz -d /tmp/godot-templates
            mkdir -p "$HOME/.local/share/godot/export_templates"
            mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi
      - uses: actions/cache/save@v4
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/voxhaven/godot
          key: godot-linux-x64-4.5.1
      - uses: actions/cache/save@v4
        if: steps.templates-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.local/share/godot/export_templates/4.5.1.stable
          key: godot-templates-4.5.1
      # Debug-only signer. A fresh random key for EVERY build makes Android refuse
      # upgrades: INSTALL_FAILED_UPDATE_INCOMPATIBLE. Cache and reuse one key.
      # Cache eviction may still require reinstalling; release signing must use
      # separately managed credentials, NEVER this QA-only debug key.
      - uses: actions/cache/restore@v4
        id: debug-key-cache
        with:
          path: ~/.android/voxhaven-qa.keystore
          key: voxhaven-qa-debug-signing-v1
      - name: Configure debug signing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -s "$HOME/.android/voxhaven-qa.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/voxhaven-qa.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Voxhaven Debug QA,O=Voxhaven,C=PH" -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/voxhaven-qa.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|Alias name:'
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/voxhaven-qa.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
      - uses: actions/cache/save@v4
        if: steps.debug-key-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.android/voxhaven-qa.keystore
          key: voxhaven-qa-debug-signing-v1
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
      - uses: actions/cache/save@v4
        if: steps.import-cache.outputs.cache-hit != 'true'
        with:
          path: .godot/imported
          key: ${{ steps.import-cache.outputs.cache-primary-key }}
      - name: Export debug APK
        run: |
          set -o pipefail
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/voxhaven-qa.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --verbose --path . --export-debug Android build/voxhaven-debug.apk 2>&1 | tee export.log
          test -s build/voxhaven-debug.apk
          if grep -E 'SCRIPT ERROR:|ERROR:' export.log; then exit 1; fi
      - name: Verify APK
        run: |
          unzip -tq build/voxhaven-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/voxhaven-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/voxhaven-debug.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          unzip -l build/voxhaven-debug.apk | grep 'lib/arm64-v8a/libgodot_android.so'
      - uses: actions/upload-artifact@v4
        with:
          name: voxhaven-android-debug
          path: build/voxhaven-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: '*.log'
          retention-days: 3
