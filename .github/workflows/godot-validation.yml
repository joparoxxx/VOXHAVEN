name: Godot validation
on:
  push:
    branches: ['game/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.4.1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo mv /tmp/godot/Godot* /usr/local/bin/godot
          godot --version
      - name: Install virtual display and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - name: Configure software Vulkan
        run: |
          dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Import assets
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
      - name: Registry test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/registry_test.gd 2>&1 | tee registry.log
          if grep -E 'SCRIPT ERROR:|ERROR:' registry.log; then exit 1; fi
      - name: Scene smoke test
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . -- --smoke 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation-logs
          path: '*.log'

          icd=$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Import assets
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
      - name: Registry test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/registry_test.gd 2>&1 | tee registry.log
          if grep -E 'SCRIPT ERROR:|ERROR:' registry.log; then exit 1; fi
      - name: Scene smoke test
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . -- --smoke 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation-logs
          path: '*.log'
 | head -n 1)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Import assets
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
      - name: Registry test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/registry_test.gd 2>&1 | tee registry.log
          if grep -E 'SCRIPT ERROR:|ERROR:' registry.log; then exit 1; fi
      - name: Scene smoke test
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . -- --smoke 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation-logs
          path: '*.log'
