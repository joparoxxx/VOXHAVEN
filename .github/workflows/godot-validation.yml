name: Godot validation
on:
  push:
    branches: ['game/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.4.1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          sudo mv /tmp/godot/Godot* /usr/local/bin/godot
          godot --version
      - name: Import assets
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
      - name: Registry test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/registry_test.gd 2>&1 | tee registry.log
          if grep -E 'SCRIPT ERROR:|ERROR:' registry.log; then exit 1; fi
      - name: Scene smoke test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . -- --smoke 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation-logs
          path: '*.log'
