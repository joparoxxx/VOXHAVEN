name: Godot validation
on:
  workflow_dispatch:
  push:
    branches:
      - game/colony-foundation
    paths:
      - 'world/**'
      - 'colony/**'
      - 'tests/**'
      - 'assets/**'
      - 'project.godot'
      - '.github/workflows/godot-validation.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.5.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/voxhaven/godot
          key: godot-linux-x64-4.5.1
      - uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-4.5.1-${{ runner.os }}-${{ hashFiles('assets/**', '**/*.import', 'project.godot') }}
      - name: Install pinned Godot
        run: |
          mkdir -p "$HOME/.cache/voxhaven/godot"
          binary="$HOME/.cache/voxhaven/godot/godot"
          if [ ! -x "$binary" ]; then
            curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot
            install /tmp/godot/Godot* "$binary"
          fi
          sudo install "$binary" /usr/local/bin/godot
          godot --version
      - name: Install virtual display and Mesa
        run: |
          if ! dpkg -s xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
          fi
      - name: Configure software Vulkan
        run: |
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Import assets
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
      - name: Registry test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/registry_test.gd 2>&1 | tee registry.log
          if grep -E 'SCRIPT ERROR:|ERROR:' registry.log; then exit 1; fi
      - name: Voxel data test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/voxel_world_test.gd 2>&1 | tee voxel.log
          if grep -E 'SCRIPT ERROR:|ERROR:' voxel.log; then exit 1; fi
      - name: Scene smoke test
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . res://scenes/asset_lab.tscn -- --smoke 2>&1 | tee smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' smoke.log; then exit 1; fi
      - name: Chunk mesh test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/chunk_mesh_test.gd 2>&1 | tee mesh.log
          if grep -E 'SCRIPT ERROR:|ERROR:' mesh.log; then exit 1; fi
      - name: World persistence test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/world_save_test.gd 2>&1 | tee persistence.log
          if grep -E 'SCRIPT ERROR:|ERROR:' persistence.log; then exit 1; fi
      - name: Terrain decoration test
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/terrain_decor_test.gd 2>&1 | tee decor.log
          if grep -E 'SCRIPT ERROR:|ERROR:' decor.log; then exit 1; fi
      - name: Terrain atlas test
        run: |
          set -o pipefail
          timeout 180 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script res://tests/terrain_atlas_test.gd 2>&1 | tee atlas.log
          if grep -E 'SCRIPT ERROR:|ERROR:' atlas.log; then exit 1; fi
      - name: Cube World character model and animation validation
        run: |
          set -o pipefail
          timeout 180 godot --headless --path . --script res://tests/colonist_models_test.gd 2>&1 | tee colonist_models.log
          if grep -E 'SCRIPT ERROR:|ERROR:' colonist_models.log; then exit 1; fi
      - name: Colony simulation and AI tests
        run: |
          set -o pipefail
          for test in colony_simulation_test colony_ai_test colonist_movement_test mining_jobs_test resource_logistics_test woodcut_stockpile_test stockpile_view_test; do
            timeout 180 godot --headless --path . --script "res://tests/$test.gd" 2>&1 | tee "$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "$test.log"; then exit 1; fi
          done
      - name: World rendering smoke test
        run: |
          set -o pipefail
          timeout 180 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . -- --world-smoke 2>&1 | tee world.log
          if grep -E 'SCRIPT ERROR:|ERROR:' world.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation-logs
          path: '*.log'
          retention-days: 3
